<section id="comunidad" class="scroll-mt-24 py-12 md:py-[var(--space-9)]" aria-labelledby="community-title">
  <div class="page-x grid items-center gap-8 md:grid-cols-2 md:gap-12">
    <div class="flex flex-col items-start gap-4">
      <app-status-badge [status]="community().status" />
      <h2 id="community-title" class="text-fluid-lg m-0">{{ community().title }}</h2>
      <p class="m-0">{{ community().text }}</p>
    </div>
    <div class="bg-primary-tint grid min-h-[16rem] place-items-center rounded-xl">
      <app-plant [grow]="true" class="[&_svg]:size-auto [&_svg]:h-40" />
    </div>
  </div>
</section>
