<section id="apoyo" class="border-line scroll-mt-24 border-t py-12 md:py-[var(--space-8)]" aria-label="Apoyo al proyecto">
  <div class="page-x flex flex-col items-center gap-6">
    <p class="text-ink-muted m-0 max-w-[52rem] text-center text-[length:var(--button-size)]">{{ text() }}</p>
    @if (logos()?.src; as logosSrc) {
      <img [src]="logosSrc" [alt]="logos()?.alt ?? ''" class="h-auto w-full max-w-[42rem]" loading="lazy" decoding="async" />
    }
  </div>
</section>
